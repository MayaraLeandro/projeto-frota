<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist de Posto - Abastecimento e Frota</title>
    <style>
        :root {
            --primary: #007bff;
            --success: #28a745;
            --bg: #f4f6f9;
            --card-bg: #ffffff;
            --text: #333333;
            --border: #ced4da;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 650px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin: auto;
        }

        h2 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 25px;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #495057;
        }

        input[type="text"], input[type="number"], select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
            background-color: #fff;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
            outline: none;
        }

        fieldset {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
            background-color: #fafbfc;
        }

        legend {
            font-weight: bold;
            color: var(--primary);
            padding: 0 10px;
            font-size: 16px;
        }

        .checklist-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eaeaea;
        }

        .checklist-item:last-child {
            border-bottom: none;
        }

        .options-group {
            display: flex;
            gap: 15px;
        }

        .options-group label {
            font-weight: normal;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .location-box {
            background: #e9ecef;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            color: #495057;
            margin-top: 5px;
        }

        button.btn-submit {
            background: var(--success);
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.btn-submit:hover {
            background: #218838;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Registro de Posto & Abastecimento</h2>
    
    <form id="formPosto">
        <div class="form-group">
            <label for="placa">Placa do Veículo:</label>
            <input type="text" id="placa" required placeholder="Ex: ABC-1234" style="text-transform: uppercase;">
        </div>

        <div class="form-group">
            <label for="motorista">Nome do Motorista:</label>
            <input type="text" id="motorista" required placeholder="Seu nome completo">
        </div>

        <fieldset>
            <legend>Inspeção no Posto</legend>
            
            <div class="checklist-item">
                <span>Pneus</span>
                <div class="options-group">
                    <label><input type="radio" name="pneu" value="OK" checked> OK</label>
                    <label><input type="radio" name="pneu" value="Pendente"> Pendente</label>
                </div>
            </div>

            <div class="checklist-item">
                <span>Óleo do Motor</span>
                <div class="options-group">
                    <label><input type="radio" name="oleo" value="OK" checked> OK</label>
                    <label><input type="radio" name="oleo" value="Pendente"> Pendente</label>
                </div>
            </div>

            <div class="checklist-item">
                <span>Infiltração do Baú</span>
                <div class="options-group">
                    <label><input type="radio" name="infiltracaoBau" value="OK" checked> OK</label>
                    <label><input type="radio" name="infiltracaoBau" value="Pendente"> Pendente</label>
                </div>
            </div>

            <div class="checklist-item">
                <span>Para-brisa</span>
                <div class="options-group">
                    <label><input type="radio" name="parabrisa" value="OK" checked> OK</label>
                    <label><input type="radio" name="parabrisa" value="Pendente"> Pendente</label>
                </div>
            </div>

            <div class="checklist-item">
                <span>Troca de Óleo</span>
                <div class="options-group">
                    <label><input type="radio" name="trocaOleo" value="OK" checked> OK</label>
                    <label><input type="radio" name="trocaOleo" value="Pendente"> Pendente</label>
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend>Dados de Abastecimento</legend>
            
            <div class="form-group">
                <label for="kmAtual">KM Atual do Veículo:</label>
                <input type="number" id="kmAtual" required placeholder="Ex: 45000">
            </div>

            <div class="form-group">
                <label for="litrosAbastecidos">Litros Abastecidos:</label>
                <input type="number" step="0.01" id="litrosAbastecidos" required placeholder="Ex: 50.5">
            </div>

            <div class="form-group">
                <label for="valorTotal">Valor Total Pago (R$):</label>
                <input type="number" step="0.01" id="valorTotal" required placeholder="Ex: 300.00">
            </div>
        </fieldset>

        <div class="form-group">
            <label>Localização Atual do Posto:</label>
            <div class="location-box" id="statusLocalizacao">Obtendo localização GPS...</div>
            <input type="hidden" id="latitude">
            <input type="hidden" id="longitude">
        </div>

        <button type="submit" class="btn-submit">Enviar Dados do Posto</button>
    </form>
</div>

<script>
    // Obter Geolocalização Real do Posto
    if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(function(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            document.getElementById('latitude').value = lat;
            document.getElementById('longitude').value = lon;
            
            const linkMaps = `https://www.google.com/maps?q=${lat},${lon}`;
            document.getElementById('statusLocalizacao').innerHTML = `📍 Localização capturada com sucesso! <br><a href="${linkMaps}" target="_blank" style="color: #007bff; text-decoration: underline;">Ver no Google Maps Real</a>`;
        }, function(error) {
            document.getElementById('statusLocalizacao').innerHTML = "⚠️ Não foi possível obter a localização. Permita o acesso ao GPS.";
        });
    } else {
        document.getElementById('statusLocalizacao').innerHTML = "⚠️ Geolocalização não suportada neste navegador.";
    }

    document.getElementById('formPosto').addEventListener('submit', async function(e) {
        e.preventDefault();

        const dadosPosto = {
            placa: document.getElementById('placa').value.toUpperCase(),
            motorista: document.getElementById('motorista').value,
            tipo: 'Posto/Abastecimento',
            pneu: document.querySelector('input[name="pneu"]:checked').value,
            oleo: document.querySelector('input[name="oleo"]:checked').value,
            infiltracaoBau: document.querySelector('input[name="infiltracaoBau"]:checked').value,
            parabrisa: document.querySelector('input[name="parabrisa"]:checked').value,
            trocaOleo: document.querySelector('input[name="trocaOleo"]:checked').value,
            kmAtual: parseFloat(document.getElementById('kmAtual').value),
            litrosAbastecidos: parseFloat(document.getElementById('litrosAbastecidos').value),
            valorTotal: parseFloat(document.getElementById('valorTotal').value),
            latitude: document.getElementById('latitude').value,
            longitude: document.getElementById('longitude').value
        };

        try {
            const resposta = await fetch('https://projeto-frota.onrender.com/api/checklists', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dadosPosto)
            });

            if (resposta.ok) {
                alert('Dados de posto enviados e cálculo de média realizado com sucesso!');
                document.getElementById('formPosto').reset();
            } else {
                alert('Erro ao enviar os dados. Tente novamente.');
            }
        } catch (erro) {
            alert('Erro de conexão com o servidor.');
        }
    });
</script>

</body>
</html>
